<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>RÉGIE — Contrôle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10;
    --panel:#12151b;
    --panel-2:#191d25;
    --line:#242a35;
    --text:#f2f4f7;
    --sub:#7d8896;
    --amber:#ff8a1e;
    --green:#2ecc71;
    --red:#e6394a;
    --blue:#4ea1ff;
    --mono:'Space Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding-bottom:40px;}
  header{position:sticky;top:0;z-index:10;background:var(--bg);padding:18px 20px 10px;border-bottom:1px solid var(--line);}
  header h1{font-family:var(--mono);font-size:15px;letter-spacing:3px;text-transform:uppercase;margin:0 0 2px;color:var(--sub);}
  header .sub{font-size:13px;color:var(--sub);}
  .conn{display:inline-block;margin-top:8px;font-size:11px;font-family:var(--mono);letter-spacing:1px;}
  .conn.ok::before{content:"● ";color:var(--green);}
  .conn.bad::before{content:"● ";color:var(--red);}

  main{padding:16px;max-width:520px;margin:0 auto;}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
  section h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin:0 0 12px;font-weight:600;}

  .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .status-btn{
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    border-radius:10px;padding:14px 10px;font-family:var(--sans);font-weight:700;font-size:14px;
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  }
  .status-btn .dot{width:10px;height:10px;border-radius:50%;}
  .status-btn.active{outline:2px solid var(--amber);background:#20180d;}

  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 6px;font-weight:600;}
  input[type=text], input[type=number], textarea{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    color:var(--text);padding:11px 12px;font-size:15px;font-family:var(--sans);
  }
  textarea{resize:vertical;min-height:70px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  button.primary{
    width:100%;padding:13px;border:none;border-radius:10px;background:var(--amber);
    color:#1a0f00;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px;
  }
  button.secondary{
    width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:transparent;
    color:var(--text);font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;
  }
  button.danger{background:var(--red);color:#fff;}
  button.ghost{background:var(--panel-2);color:var(--sub);}
  button:active{transform:scale(.98);}

  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;}

  .order-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .order-row input{flex:1;}
  .order-row input.time{flex:0 0 70px;}
  .order-row .rm{flex:0 0 34px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--red);font-weight:700;cursor:pointer;}

  .color-picker{display:flex;gap:10px;margin-top:8px;}
  .color-swatch{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
  .color-swatch.selected{border-color:#fff;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);padding:10px 20px;border-radius:20px;
    font-size:13px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <h1>Régie — Contrôle</h1>
  <div class="sub">Pilote l'écran staff en temps réel</div>
  <div class="conn bad" id="connIndicator">connexion…</div>
</header>

<main>

  <section>
    <h2>État du concert</h2>
    <div class="status-grid" id="statusGrid">
      <button class="status-btn" data-status="before"><span class="dot" style="background:var(--sub)"></span>Avant show</button>
      <button class="status-btn" data-status="doors"><span class="dot" style="background:var(--blue)"></span>Portes ouvertes</button>
      <button class="status-btn" data-status="live"><span class="dot" style="background:var(--green)"></span>En cours</button>
      <button class="status-btn" data-status="intermission"><span class="dot" style="background:var(--amber)"></span>Entracte</button>
      <button class="status-btn" data-status="encore"><span class="dot" style="background:var(--amber)"></span>Rappel</button>
      <button class="status-btn" data-status="end"><span class="dot" style="background:var(--sub)"></span>Terminé</button>
    </div>
  </section>

  <section>
    <h2>Minutage</h2>
    <label>Libellé (ex: "Avant l'entrée en scène")</label>
    <input type="text" id="timerLabel" placeholder="Minutage">
    <label>Durée (minutes)</label>
    <input type="number" id="timerMinutes" placeholder="15" min="0">
    <div class="row">
      <button class="primary" id="btnStartTimer">Démarrer</button>
      <button class="secondary" id="btnStopTimer">Arrêter</button>
    </div>
  </section>

  <section>
    <h2>Annonce plein écran</h2>
    <label>Texte de l'annonce</label>
    <textarea id="announceText" placeholder="Ex: RAPPEL — TOUT LE MONDE EN PLACE DANS 5 MIN"></textarea>
    <div class="color-picker" id="colorPicker">
      <div class="color-swatch selected" data-color="amber" style="background:var(--amber)"></div>
      <div class="color-swatch" data-color="red" style="background:var(--red)"></div>
      <div class="color-swatch" data-color="green" style="background:var(--green)"></div>
      <div class="color-swatch" data-color="blue" style="background:var(--blue)"></div>
    </div>
    <div class="presets">
      <div class="chip" data-preset="5 MINUTES AVANT ENTRÉE EN SCÈNE">5 min avant scène</div>
      <div class="chip" data-preset="PAUSE TECHNIQUE — RESTEZ EN PLACE">Pause technique</div>
      <div class="chip" data-preset="ÉVACUATION — SUIVEZ LES CONSIGNES">Évacuation</div>
    </div>
    <button class="primary" id="btnAnnounce">Afficher l'annonce</button>
    <button class="secondary" id="btnClearAnnounce">Effacer l'annonce</button>
  </section>

  <section>
    <h2>Prochainement</h2>
    <input type="text" id="nextAct" placeholder="Ex: Set 2 — 21h30">
    <button class="secondary" id="btnSaveNext">Enregistrer</button>
  </section>

  <section>
    <h2>Déroulé (running order)</h2>
    <div id="orderRows"></div>
    <button class="ghost" id="btnAddRow" style="margin-top:4px;">+ Ajouter une ligne</button>
    <button class="secondary" id="btnSaveOrder">Enregistrer le déroulé</button>
  </section>

  <section>
    <h2>Infos bandeau bas d'écran</h2>
    <label>Wi-Fi — réseau</label>
    <input type="text" id="wifiSsid" placeholder="STAFF-CONCERT">
    <label>Wi-Fi — mot de passe</label>
    <input type="text" id="wifiPass" placeholder="motdepasse">
    <label>Météo</label>
    <input type="text" id="weather" placeholder="Ex: 18°C, dégagé">
    <label>Couvre-feu / heure de fin imposée</label>
    <input type="text" id="curfew" placeholder="Ex: 23h00">
    <label>Contact urgence</label>
    <input type="text" id="emergencyContact" placeholder="Ex: Sécurité — 06 12 34 56 78">
    <button class="primary" id="btnSaveInfo">Enregistrer les infos</button>
  </section>

  <section>
    <h2>Alerte d'urgence</h2>
    <button class="danger" id="btnEmergency">🚨 Déclencher l'alerte plein écran</button>
  </section>

</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ⚠️ Utilise EXACTEMENT la même config que display.html (même projet Firebase)
const firebaseConfig = {
  apiKey: "AIzaSyDSG5LDhOSR2ls5tBD-MbFpslt_-7VSKNc",
  authDomain: "concert-53cb5.firebaseapp.com",
  databaseURL: "https://concert-53cb5-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "concert-53cb5",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const concertRef = ref(db, "concertScreen");

let currentData = {};
let selectedColor = "amber";

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}

function push(patch){
  update(concertRef, { ...patch, updatedAt: Date.now() })
    .then(() => showToast("Mis à jour ✓"))
    .catch(() => showToast("Erreur de connexion"));
}

// --- status buttons ---
document.querySelectorAll(".status-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    push({ status: btn.dataset.status });
  });
});

function highlightStatus(status){
  document.querySelectorAll(".status-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.status === status);
  });
}

// --- timer ---
document.getElementById("btnStartTimer").addEventListener("click", () => {
  const minutes = parseFloat(document.getElementById("timerMinutes").value || "0");
  const label = document.getElementById("timerLabel").value || "MINUTAGE";
  const endAt = Date.now() + minutes * 60000;
  push({ timerEndAt: endAt, timerRunning: true, timerLabel: label });
});
document.getElementById("btnStopTimer").addEventListener("click", () => {
  push({ timerRunning: false });
});

// --- announcement ---
document.getElementById("colorPicker").addEventListener("click", (e) => {
  const sw = e.target.closest(".color-swatch");
  if (!sw) return;
  selectedColor = sw.dataset.color;
  document.querySelectorAll(".color-swatch").forEach(s => s.classList.remove("selected"));
  sw.classList.add("selected");
});
document.querySelectorAll(".presets .chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.getElementById("announceText").value = chip.dataset.preset;
  });
});
document.getElementById("btnAnnounce").addEventListener("click", () => {
  const text = document.getElementById("announceText").value.trim();
  if (!text) return showToast("Écris un texte d'abord");
  push({ announcement: { text, color: selectedColor, active: true } });
});
document.getElementById("btnClearAnnounce").addEventListener("click", () => {
  push({ announcement: { text: "", color: selectedColor, active: false } });
});

// --- emergency ---
document.getElementById("btnEmergency").addEventListener("click", () => {
  push({ announcement: { text: "URGENCE — SUIVEZ LES CONSIGNES DE SÉCURITÉ", color: "red", active: true } });
});

// --- next act ---
document.getElementById("btnSaveNext").addEventListener("click", () => {
  push({ nextAct: document.getElementById("nextAct").value });
});

// --- running order ---
function addOrderRow(time="", name="", current=false, done=false){
  const wrap = document.getElementById("orderRows");
  const row = document.createElement("div");
  row.className = "order-row";
  row.innerHTML = `
    <input type="text" class="time" placeholder="20h30" value="${time}">
    <input type="text" class="name" placeholder="Nom du set / intervenant" value="${name}">
    <button class="rm">✕</button>
  `;
  row.querySelector(".rm").addEventListener("click", () => row.remove());
  wrap.appendChild(row);
}
document.getElementById("btnAddRow").addEventListener("click", () => addOrderRow());
document.getElementById("btnSaveOrder").addEventListener("click", () => {
  const rows = [...document.querySelectorAll(".order-row")].map(r => ({
    time: r.querySelector(".time").value,
    name: r.querySelector(".name").value,
  })).filter(r => r.name.trim() !== "");
  push({ runningOrder: rows });
});

// --- bottom strip info ---
document.getElementById("btnSaveInfo").addEventListener("click", () => {
  push({
    wifi: {
      ssid: document.getElementById("wifiSsid").value,
      pass: document.getElementById("wifiPass").value,
    },
    weather: document.getElementById("weather").value,
    curfew: document.getElementById("curfew").value,
    emergencyContact: document.getElementById("emergencyContact").value,
  });
});

// --- sync form fields with current DB state (so control reflects reality) ---
let formsInitialized = false;
onValue(concertRef, (snap) => {
  document.getElementById("connIndicator").textContent = "synchronisé";
  document.getElementById("connIndicator").className = "conn ok";
  const data = snap.val() || {};
  currentData = data;
  highlightStatus(data.status);

  if (!formsInitialized) {
    formsInitialized = true;
    document.getElementById("nextAct").value = data.nextAct || "";
    document.getElementById("wifiSsid").value = data.wifi?.ssid || "";
    document.getElementById("wifiPass").value = data.wifi?.pass || "";
    document.getElementById("weather").value = data.weather || "";
    document.getElementById("curfew").value = data.curfew || "";
    document.getElementById("emergencyContact").value = data.emergencyContact || "";
    const order = data.runningOrder || [];
    if (order.length) {
      order.forEach(o => addOrderRow(o.time, o.name));
    } else {
      addOrderRow(); addOrderRow();
    }
  }
}, () => {
  document.getElementById("connIndicator").textContent = "hors ligne";
  document.getElementById("connIndicator").className = "conn bad";
});
</script>
</body>
</html>
